[workspace]
resolver = "3"
members = ["crates/hakucx", "crates/haku-core", "crates/haku-release", "crates/haku-brand", "crates/haku-lights"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/galaxygas/HakuCX"
rust-version = "1.97"
authors = ["HakuCX contributors"]

[workspace.dependencies]
# Servo publishes monthly releases with breaking API changes: pin exactly and upgrade deliberately.
servo = { version = "=0.7.0" }
winit = "0.30.13"
euclid = "0.22"
url = "2.5"
glow = "0.17"
gleam = "0.15"
surfman = "0.14"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
headers = "0.4"
http = "1.4"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.38", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
html-escape = "0.3"
tempfile = "3"
include_dir = "0.7"
ts-rs = { version = "12", features = ["serde-json-impl"] }
dirs = "7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23"
rfd = "0.17"
open = "5"
# Thread-safe engine (no "single-thread"), so filter engines can be built off the UI thread.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
content-security-policy = "0.9"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Cryptography", "Win32_System_WinRT", "Security_Credentials_UI", "Win32_System_Registry", "Win32_UI_Shell", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging", "Win32_System_Power"] }
keyring = { version = "3.6", features = ["windows-native"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "http2", "charset", "gzip", "brotli", "deflate", "json"] }
# Extension packages (.crx, .xpi, .zip) and sync bundles.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
# Pure-Rust deflate backend for zip.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
regex = "1"
# The password vault and sync bundles: XChaCha20-Poly1305 and Argon2id (RustCrypto).
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = "1"
getrandom = "0.3"
# Waiting on Windows Hello's asynchronous result.
windows-future = "0.3"
# Update signatures (minisign; the verifier and signer by its author).
minisign-verify = "0.2"
minisign = "0.7"
# Signature checks for .crx packages; the same library rustls already builds.
aws-lc-rs = { version = "1.18", features = ["prebuilt-nasm"] }
# Same major version as Servo's, so cookies can be handed to its cookie store.
cookie = "0.18"
haku-core = { path = "crates/haku-core" }
haku-brand = { path = "crates/haku-brand" }
haku-lights = { path = "crates/haku-lights" }
# My Flow's local-network page for phones (plain HTTP/1.1, no TLS).
tiny_http = "0.12"
# Smart home: publish to your MQTT broker (Home Assistant and others).
rumqttc = { version = "0.25", default-features = false }
# The system clipboard (the same library Servo's default clipboard uses).
arboard = { version = "3.6", default-features = false }
# Puts the icon and version information into hakucx.exe.
embed-resource = "3"

# Servo is enormous; keep dev builds usable and the target dir small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 16
debug = false
