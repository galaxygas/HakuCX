[package]
name = "hakucx"
description = "HakuCX: an independent, customizable GX-style browser built on Rust and Servo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
# Released as a browser, not as a library on crates.io.
publish = false
build = "build.rs"

[[bin]]
name = "hakucx"
path = "src/main.rs"

[dependencies]
servo = { workspace = true }
winit = { workspace = true }
euclid = { workspace = true }
url = { workspace = true }
glow = { workspace = true }
gleam = { workspace = true }
surfman = { workspace = true }
rustls = { workspace = true }
headers = { workspace = true }
http = { workspace = true }
mime_guess = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
include_dir = { workspace = true }
haku-core = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
rfd = { workspace = true }
open = { workspace = true }
reqwest = { workspace = true }
adblock = { workspace = true }
content-security-policy = { workspace = true }
rodio = { workspace = true }
sysinfo = { workspace = true }
keyring = { workspace = true }
dirs = { workspace = true }
html-escape = { workspace = true }
uuid = { workspace = true }
cookie = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Servo's own shell uses ANGLE (EGL over D3D) on Windows instead of WGL.
servo = { workspace = true, features = ["no-wgl"] }
windows = { workspace = true }
windows-future = { workspace = true }
