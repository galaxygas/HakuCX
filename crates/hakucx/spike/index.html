<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HakuCX shell</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div id="frame">
  <header id="tabstrip">
    <div class="logo" title="HakuCX">H</div>
    <div id="tabs"></div>
    <button id="newtab" title="New tab">+</button>
  </header>
  <nav id="toolbar">
    <button data-cmd="back" title="Back">&#8592;</button>
    <button data-cmd="forward" title="Forward">&#8594;</button>
    <button data-cmd="reload" title="Reload">&#8635;</button>
    <input id="address" placeholder="Enter search or web address" spellcheck="false">
    <span id="blocked" class="chip">0 blocked</span>
    <button id="shot" title="Snapshot">&#9635;</button>
    <button id="evalbtn" title="Check user script">JS</button>
    <button id="menubtn" title="Menu">&#9776;</button>
  </nav>
  <div id="body">
    <aside id="sidebar">
      <div class="sib active">&#9673;</div><div class="sib">&#9881;</div><div class="sib">&#9835;</div>
    </aside>
    <main id="viewport"></main>
  </div>
  <footer id="status">ready</footer>
</div>
<div id="menu" hidden>
  <div class="menu-title">CSS CHECKS</div>
  <div class="notch">clip-path notch</div>
  <div class="glass">backdrop-filter blur</div>
  <div class="pulse">keyframes animation</div>
  <div class="skew">transform skew</div>
  <button id="closemenu">Close</button>
</div>
<script src="shell.js"></script>
</body>
</html>
