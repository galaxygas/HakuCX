[env]
# TypeScript bindings for IPC types are generated by `cargo test -p haku-core` (ts-rs) into the UI.
TS_RS_EXPORT_DIR = { value = "ui/src/ipc/generated", relative = true }
# All integers crossing IPC are JSON numbers (timestamps in ms, byte counts < 2^53).
TS_RS_LARGE_INT = "number"
# Default LLVM location from `winget install LLVM.LLVM`; an existing LIBCLANG_PATH wins.
LIBCLANG_PATH = 'C:\Program Files\LLVM\bin'
