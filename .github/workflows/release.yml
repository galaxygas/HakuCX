name: Release

# Pushing a tag `vX.Y.Z` (matching the workspace version) builds the Windows installer and
# portable zip, signs them with the update key, and publishes a GitHub release. Running the
# workflow by hand builds the packages without publishing (signed only if the key is set).
# See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Package for Windows
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: D:\target
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install NSIS (installer builder)
        shell: pwsh
        run: |
          # The runner image does not ship NSIS; Chocolatey does.
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "installing NSIS failed" }
          $makensis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw "makensis.exe not found after installing NSIS" }
          & $makensis /VERSION

      - name: Install GStreamer (audio and video)
        shell: pwsh
        run: ./packaging/windows/gstreamer.ps1 -Install

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match version $version" }
          if (-not (Test-Path packaging/update-key.pub)) { throw "packaging/update-key.pub is missing: releases must be updatable" }

      - name: Build and package
        shell: pwsh
        run: |
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }
          ./packaging/windows/package.ps1

      - name: Sign
        shell: pwsh
        env:
          HAKU_SIGNING_KEY: ${{ secrets.HAKU_SIGNING_KEY }}
          HAKU_SIGNING_PASSWORD: ${{ secrets.HAKU_SIGNING_PASSWORD }}
        run: |
          if (-not $env:HAKU_SIGNING_KEY) {
            if ("${{ github.ref }}".StartsWith("refs/tags/")) { throw "HAKU_SIGNING_KEY is not set: refusing to publish unsigned packages" }
            Write-Host "No signing key: packages stay unsigned (manual run)."
            exit 0
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          foreach ($file in Get-ChildItem dist\*.exe, dist\*.zip) {
            & "$env:CARGO_TARGET_DIR\release\haku-release.exe" sign $file.FullName $version
            if ($LASTEXITCODE -ne 0) { throw "signing $($file.Name) failed" }
          }
          Get-FileHash dist\*.exe, dist\*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist\SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hakucx-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.minisig
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in ".exe", ".zip", ".minisig" -or $_.Name -eq "SHA256SUMS.txt" } | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" $files --title "HakuCX ${{ github.ref_name }}" --generate-notes --verify-tag
